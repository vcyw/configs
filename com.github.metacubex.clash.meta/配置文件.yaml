proxy-groups:
- name: PROXY
  type: select
  proxies:
  - URL-TEST
  - LOAD-BALANCE
  - SELECT
  - FALLBACK
  - DIRECT
  interval: 10
- name: SELECT
  type: select
  include-all-proxies: true
  interval: 30
  timeout: 5000
  max-failed-times: 1
# 自动选择
- name: URL-TEST
  type: url-test
  include-all-proxies: true
  #url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  lazy: true
# 负载均衡
- name: LOAD-BALANCE
  type: load-balance
  #url: https://cp.cloudflare.com/generate_204
  interval: 3600
  strategy: consistent-hashing
  proxies:
    - 🇩🇪 德国-008
    - 🇩🇪 德国-007
# 自动回退（当前节点超时时，则会按代理顺序选择第一个可用节点）
- name: FALLBACK
  type: fallback
  #url: https://cp.cloudflare.com/generate_204
  interval: 3600
  include-all-proxies: true
  #proxies:
  #  - 🇫🇷 github-anytls-1
- name: FINAL
  type: select
  proxies:
  - PROXY
  - DIRECT

